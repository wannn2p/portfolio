<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark minimal terminal frame -->
  <rect width="32" height="32" rx="8" fill="#0d0d0d" />
  
  <!-- Sleek subtle border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
  
  <!-- Terminal Prompt Chevron '>' -->
  <path d="M9 11L15 16L9 21" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Cursor '_' -->
  <line x1="17.5" y1="20.5" x2="23.5" y2="20.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
</svg>
